[project]
name = "ogs-reference"
version = "3.0.0a1"
description = "Reference implementation and test vectors of the Open Glucose Stream (OGS) draft 3"
requires-python = ">=3.11"
license = "CC0-1.0"
# Crypto (secp256k1/BIP-340, NIP-44 v2, NIP-59, HKDF, ChaCha20, HMAC trees, key tweaking) is standard-library Python
# on purpose: an independent implementation. websockets is only for the live run on relays.
dependencies = ["websockets>=13"]

[project.scripts]
ogs = "ogs.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ogs"]
